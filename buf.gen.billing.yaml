# Regenerate with: buf generate --template buf.gen.billing.yaml
version: v2
inputs:
  - module: buf.build/depot/api:2ae2cc96583940688aa4b20766844296
    paths:
      - depot/core/v1/billing.proto
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/depot/depot-go/proto
  disable:
    - module: buf.build/googleapis/googleapis
plugins:
  - remote: buf.build/protocolbuffers/go:v1.33.0
    out: proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.16.1
    out: proto
    opt: paths=source_relative
